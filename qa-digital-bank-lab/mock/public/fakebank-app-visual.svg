<svg width="560" height="620" viewBox="0 0 560 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração do aplicativo Fake Bank">
  <defs>
    <linearGradient id="bg" x1="24" y1="24" x2="536" y2="596" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A3FA8"/>
      <stop offset="1" stop-color="#002776"/>
    </linearGradient>
    <linearGradient id="card" x1="170" y1="108" x2="390" y2="500" gradientUnits="userSpaceOnUse">
